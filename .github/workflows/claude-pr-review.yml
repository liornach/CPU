name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to a bare-metal RV32I CPU emulator (C, CMake build).
            Focus on:

            1. **Correctness**
               - RV32I instruction decoding/execution semantics
               - Memory access bounds and alignment handling
               - Integer overflow, sign-extension, and undefined behavior in C

            2. **Code quality**
               - Consistency with existing code style and structure
               - Unnecessary complexity or duplication

            3. **Build & tests**
               - CMakeLists.txt correctness for any new files/targets
               - Whether new behavior has test coverage under tests/

            4. **Security**
               - Unsafe memory operations, unchecked buffer sizes, unvalidated ELF/input parsing

            Leave inline comments on specific lines for concrete issues, and a concise
            top-level summary. Do not comment on style nits that don't affect correctness.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
